<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración · Fundación Jeedd Chocó</title>
  <link rel="icon" href="img/favicon.png">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <main class="admin-shell">
    <section id="login-view" class="login-card">
      <div class="login-logo"><img src="img/logo.jpg" alt="Fundación Jeedd Chocó"></div>
      <span class="eyebrow">Área privada</span>
      <h1>Panel de administración</h1>
      <p>Administra el contenido de la Fundación Jeedd Chocó.</p>
      <form id="login-form">
        <label>Usuario<input id="usuario" type="text" autocomplete="username" required></label>
        <label>Contraseña<input id="password" type="password" autocomplete="current-password" required></label>
        <button class="btn primary" type="submit">Entrar</button>
        <div id="login-error" class="alert error hidden"></div>
      </form>
    </section>

    <section id="admin-view" class="hidden">
      <header class="topbar">
        <div>
          <span class="eyebrow">Fundación Jeedd Chocó</span>
          <h1>Panel de administración</h1>
        </div>
        <div class="top-actions">
          <a class="btn secondary" href="index.html" target="_blank">Ver página</a>
          <button id="logout" class="btn danger-outline">Cerrar sesión</button>
        </div>
      </header>

      <div class="notice">Los cambios se guardan en TiDB Cloud. Las imágenes nuevas se almacenan en Vercel Blob.</div>
      <div id="save-status" class="alert hidden"></div>
      <div id="groups" class="groups"></div>
    </section>
  </main>
  <script src="js/admin.js"></script>
</body>
</html>
